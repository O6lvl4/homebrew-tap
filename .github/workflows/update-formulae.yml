name: Update formulae

# The tap pulls, rather than each project pushing to it. Updating a formula is
# then a write to this repository, which the built-in GITHUB_TOKEN can do — so
# there is no personal access token to create, store, or rotate.
#
# The previous arrangement had codopsy push here on release. It never ran once:
# a release created with GITHUB_TOKEN does not trigger workflows, and the
# TAP_TOKEN secret it expected was never set.

on:
  schedule:
    - cron: '17 6 * * *'
  workflow_dispatch:
    inputs:
      formula:
        description: Formula names to update, space separated (blank = all)
        required: false
        default: ''

permissions:
  contents: write

concurrency:
  group: update-formulae

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Point formulae at the latest upstream releases
        env:
          GH_TOKEN: ${{ github.token }}
          # Via env, not direct interpolation into the run script.
          FORMULA: ${{ inputs.formula }}
        run: python3 .github/scripts/update_formulae.py $FORMULA

      - name: Commit and push
        run: |
          git add Formula
          if git diff --cached --quiet; then
            echo "No formula changed; nothing to push"
            exit 0
          fi
          names=$(git diff --cached --name-only \
            | xargs -n1 basename | sed 's/\.rb$//' | paste -sd' ' -)
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git commit -m "formulaを最新リリースに更新: $names"
          git push
